[package]
name = "agenticord"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A tiny headless Discord user-account client for AI agents, exposed over MCP"
repository = "https://github.com/Fayberr/agenticord"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "cookies", "json", "multipart"] }
rsa = { version = "0.9", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync", "signal", "io-util", "io-std", "fs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[profile.dev]
debug = 0

# RSA key generation for QR login is unusably slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
